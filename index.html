<head>

  <meta property="og:title" content="宅配單號查詢｜泰泰烤豬串">
  <meta property="og:description" content="使用訂購時填寫的手機號碼查詢低溫宅配單號">
  <meta property="og:type" content="website">

  <title>宅配單號查詢｜泰泰烤豬串</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%239e2f25'/%3E%3Cpath d='M17 24h30v24H17z' fill='%23fff4dc'/%3E%3Cpath d='M17 24l15-9 15 9-15 9z' fill='%23f6c363'/%3E%3Cpath d='M32 33v15' stroke='%239e2f25' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root{--black:#17120b;--panel:#fffdfa;--gold:#f2a400;--gold-dark:#d68e00;--cream:#fff8e8;--ink:#241a0c;--muted:#756a59;--line:#ead6aa;--white:#fff;--shadow:0 28px 80px rgba(103,68,6,.16)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(circle at 14% 8%,rgba(242,164,0,.24),transparent 31%),radial-gradient(circle at 90% 92%,rgba(242,164,0,.14),transparent 28%),linear-gradient(145deg,#fffdf7 0%,#fff6e4 52%,#f8e8c5 100%);display:grid;place-items:center;padding:28px 18px;touch-action:pan-x pan-y}
    main{width:min(100%,520px)}
    .brand{display:flex;align-items:center;gap:14px;margin:0 0 20px 6px;color:var(--gold);font-weight:850;letter-spacing:.02em}
    .brand-mark{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#000;box-shadow:0 8px 24px rgba(242,164,0,.24)}
    .brand-mark img,.brand-mark svg{width:100%;height:100%;object-fit:cover;display:block}
    .card{background:rgba(255,253,250,.94);border:1px solid rgba(242,164,0,.38);border-radius:30px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:.86rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
    .eyebrow:before{content:"";width:22px;height:3px;border-radius:99px;background:var(--gold)}
    h1{font-size:clamp(2rem,7vw,3rem);line-height:1.12;margin:0 0 12px;letter-spacing:-.035em}
    .intro{font-size:1rem;line-height:1.7;color:var(--muted);margin:0 0 28px}
    label{display:block;font-weight:750;font-size:.95rem;margin:0 0 9px}
    .field{display:flex;gap:10px}
    input{width:100%;min-width:0;height:55px;border:1.5px solid var(--line);border-radius:15px;padding:0 16px;font:inherit;font-size:1.05rem;color:#16110a;background:var(--cream);outline:none;transition:.2s}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,164,0,.18)}
    button,.track-link{height:55px;border:0;border-radius:15px;padding:0 21px;background:var(--gold);color:#090909;font:inherit;font-weight:850;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .15s,background .15s}
    button:hover,.track-link:hover{background:#ffb51f;transform:translateY(-1px)}
    button:disabled{opacity:.65;cursor:wait;transform:none}
    .hint{margin:10px 2px 0;font-size:.82rem;color:#8b806f}
    .message{display:none;margin-top:22px;border-radius:19px;padding:19px}
    .message.show{display:block;animation:rise .24s ease-out}
    .message.error{background:#fff1ef;color:#8e271e;border:1px solid #f3cbc5}
    .message.success{background:#fff8e8;border:1px solid #f0d497}
    .result-label{font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:6px}
    .tracking{font-size:1.32rem;font-weight:850;letter-spacing:.045em;overflow-wrap:anywhere;margin-bottom:15px}
    .actions{display:flex;gap:9px;flex-wrap:wrap}
    .actions .track-link{height:46px;font-size:.92rem}
    .copy{height:46px;background:#fff;color:var(--wine);border:1.5px solid #d9b6ad;font-size:.92rem}
    .privacy{display:flex;gap:9px;align-items:flex-start;margin:20px 4px 0;color:#776d5d;font-size:.78rem;line-height:1.55}
    .privacy svg{width:16px;min-width:16px;margin-top:2px;color:var(--gold)}
    footer{text-align:center;color:#786d5b;font-size:.78rem;margin-top:18px}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media(max-width:520px){body{padding:18px 14px}.card{padding:27px 21px;border-radius:24px}.field{display:block}.field button{width:100%;margin-top:10px}.tracking{font-size:1.14rem}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>

      <h1 id="title">查詢您的宅配單號</h1>
      <p class="intro">請輸入訂購時填寫的手機號碼，系統只會顯示與該號碼相符的宅配單號。</p>
      <form id="lookup-form" novalidate>
        <label for="phone">手機號碼</label>
        <div class="field">
          <input id="phone" name="phone" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="請輸入電話號碼" aria-describedby="phone-hint" required>
          <button id="submit" type="submit">查詢</button>
        </div>
        <p class="hint" id="phone-hint">請輸入訂購時填寫的電話號碼，不需輸入空格或連字號。</p>
      </form>

  </main>
  <script>
    const API_URL='/api/ordertracking';
    const form=document.getElementById('lookup-form'),phone=document.getElementById('phone'),message=document.getElementById('message'),submit=document.getElementById('submit');
    const resultCache=new Map();
    const format=n=>`${n.slice(0,4)}-${n.slice(4,8)}-${n.slice(8)}`;
async function lookup(value, { useCache = true } = {}) {
  const phoneNumber = String(value || '').replace(/\D/g, '');

  if (useCache && resultCache.has(phoneNumber)) {
    return resultCache.get(phoneNumber);
  }

  const response = await fetch(
    API_URL + '?phone=' + encodeURIComponent(phoneNumber),
    { cache: 'no-store' }
  );

  if (!response.ok) {
    throw new Error('API error');
  }

  const data = await response.json();

  if (useCache) {
    resultCache.set(phoneNumber, data);
  }

  return data;
}
    function lookup(value,{useCache=true}={}){if(useCache&&resultCache.has(value))return Promise.resolve(resultCache.get(value));return new Promise((resolve,reject)=>{const callback=`ttLookup_${Date.now()}_${Math.random().toString(36).slice(2)}`,script=document.createElement('script');let timer;const cleanup=()=>{clearTimeout(timer);delete window[callback];script.remove()};window[callback]=data=>{cleanup();if(useCache)resultCache.set(value,data);resolve(data)};script.onerror=()=>{cleanup();reject(new Error('network'))};timer=setTimeout(()=>{cleanup();reject(new Error('timeout'))},30000);script.src=`${API_URL}?phone=${encodeURIComponent(value)}&callback=${encodeURIComponent(callback)}&_=${Date.now()}`;document.head.appendChild(script)})}
    function renderTracking(numbers){message.className='message success show';message.innerHTML=numbers.map(tracking=>{const url=`https://www.t-cat.com.tw/Inquire/TraceDetail.aspx?BillID=${tracking}`;return `<div class="result-label">您的宅配單號</div><div class="tracking">${format(tracking)}</div><div class="actions"><a class="track-link" href="${url}" target="_blank" rel="noopener">前往黑貓查詢</a><button class="copy" type="button" data-copy="${tracking}">複製單號</button></div>`}).join('')}
    form.addEventListener('submit',async e=>{e.preventDefault();const value=phone.value.replace(/\D/g,'');if(!/^0\d{8,9}$/.test(value)){showError('請輸入正確的電話號碼。');phone.focus();return}submit.disabled=true;submit.textContent='查詢中…';try{const data=await lookup(value),numbers=Array.isArray(data.trackingNumbers)?data.trackingNumbers.filter(n=>/^\d{12}$/.test(n)):[];if(!data.success||!data.found||!numbers.length){showError('查無此手機號碼的宅配資料，請確認您輸入的是訂購時填寫的號碼。');return}renderTracking(numbers)}catch{showError('系統暫時無法查詢，請稍後再試。')}finally{submit.disabled=false;submit.textContent='查詢'}});
    message.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已複製 ✓';setTimeout(()=>b.textContent='複製單號',1600)});
    phone.addEventListener('input',()=>{phone.value=phone.value.replace(/\D/g,'');if(message.classList.contains('show'))message.className='message'});
    document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
    document.addEventListener('touchmove',event=>{if(event.touches.length>1)event.preventDefault()},{passive:false});
  </script>
